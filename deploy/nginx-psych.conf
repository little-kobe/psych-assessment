# 心理测评网站的 nginx 配置
# 放到服务器的 /etc/nginx/sites-available/psych，再链接到 sites-enabled（步骤见上线指南）
# 网址分工：/ 答题端　/admin/ 管理后台　/api/ 接口　/uploads/ 上传的图片视频

server {
    listen 80 default_server;
    server_name _;

    # 上传视频最大 200MB（和后端的限制一致）
    client_max_body_size 210m;

    # 压缩网页和脚本，打开更快
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 答题端
    root /srv/psych-assessment/frontend-user/dist;
    index index.html;

    # 管理后台
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /srv/psych-assessment/frontend-admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # 接口：转给后端（后端只在本机 3000 端口监听，外面访问不到）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传视频后要转换格式，可能需要几分钟
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 上传的图片、视频、音频
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # 打包后的脚本和样式文件名带版本号，可以长期缓存
    location /assets/ {
        expires 30d;
        access_log off;
    }

    # 其他地址（如 /q/3、/b/1）都交给答题端页面处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
